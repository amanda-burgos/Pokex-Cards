services:
  - type: redis
    name: entrenador-redis
    plan: free
    ipAllowList: []

  - type: web
    name: entrenador-pokemon
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: DOMAIN
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM
        sync: false
      - key: CHAT_PROVIDER
        value: claude
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: CLAUDE_CHAT_MODEL
        value: claude-opus-5
      - key: REDIS_URL
        fromService:
          type: redis
          name: entrenador-redis
          property: connectionString

  - type: worker
    name: entrenador-email-worker
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm run worker
    autoDeploy: true
    envVars:
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM
        sync: false
      - key: REDIS_URL
        fromService:
          type: redis
          name: entrenador-redis
          property: connectionString
